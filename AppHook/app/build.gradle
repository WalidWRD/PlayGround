plugins {
    id 'com.android.application'
}

android {
    namespace 'com.apphook.log'
    compileSdk 35

    defaultConfig {
        applicationId 'com.apphook.log'
        minSdk 26
        targetSdk 35
        versionCode 310
        versionName '3.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            resources.srcDirs += ['src/main/resources']
        }
    }
}

dependencies {
    // Modern API (LSPosed / LSPatch / NPatch / HKP) — provided at runtime
    compileOnly 'io.github.libxposed:api:102.0.0'
    // Legacy shim for old patchers — provided at runtime
    compileOnly 'de.robv.android.xposed:api:82'
}
