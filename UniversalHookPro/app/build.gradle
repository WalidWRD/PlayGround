plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pro.hook.universal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pro.hook.universal'
        minSdk 26
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API — provided only (موجودة في LSPosed/LSPatch/NPatch/HKP وقت التشغيل)
    compileOnly 'de.robv.android.xposed:api:82'
}
